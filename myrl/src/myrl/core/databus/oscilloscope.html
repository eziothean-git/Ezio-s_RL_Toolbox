<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>myrl Oscilloscope</title>
<style>
  :root { --bg: #1a1a2e; --surface: #16213e; --border: #0f3460; --text: #e0e0e0; --dim: #888; --accent: #00d4ff; --warn: #ff6b6b; --ok: #4ecdc4; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 15px; color: var(--accent); font-weight: 600; }
  header .status { margin-left: auto; font-size: 12px; }
  header .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  header .status .dot.on { background: var(--ok); } .dot.off { background: var(--warn); }
  .controls { padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; font-size: 12px; }
  .controls label { color: var(--dim); }
  .controls select, .controls input { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 2px 6px; border-radius: 3px; font-family: inherit; font-size: 12px; }
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #meter { flex: 1; overflow-y: auto; }
  #meter table { width: 100%; border-collapse: collapse; }
  #meter th { position: sticky; top: 0; background: var(--surface); padding: 6px 10px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); font-size: 12px; color: var(--dim); }
  #meter td { padding: 5px 10px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
  #meter tr:hover td { background: var(--surface); }
  #meter tr.selected td { background: #1a3a5c; }
  .ch-name { color: var(--accent); } .num { text-align: right; font-variant-numeric: tabular-nums; }
  #scope { height: 250px; min-height: 150px; border-top: 2px solid var(--border); padding: 8px; background: var(--surface); display: none; flex-direction: column; }
  #scope .scope-header { font-size: 12px; color: var(--dim); margin-bottom: 4px; display: flex; align-items: center; gap: 12px; }
  #scope .scope-header select { background: var(--bg); color: var(--accent); border: 1px solid var(--border); padding: 2px 6px; border-radius: 3px; font-family: inherit; font-size: 12px; }
  #scope .scope-chart { flex: 1; position: relative; }
  #scope .scope-chart canvas { position: absolute; top: 0; left: 0; }
  footer { padding: 4px 16px; background: var(--surface); border-top: 1px solid var(--border); font-size: 11px; color: var(--dim); display: flex; gap: 16px; }
</style>
</head>
<body>
<header>
  <h1>myrl Oscilloscope</h1>
  <div class="status"><span class="dot off" id="statusDot"></span><span id="statusText">connecting...</span></div>
</header>
<div class="controls">
  <label>env: <input type="number" id="envSelect" value="0" min="0" style="width:60px"></label>
  <label>refresh: <select id="hzSelect"><option value="5">5 Hz</option><option value="10" selected>10 Hz</option><option value="20">20 Hz</option></select></label>
  <label>frames: <select id="framesSelect"><option value="64">64</option><option value="128">128</option><option value="256" selected>256</option></select></label>
</div>
<main>
  <div id="meter">
    <table>
      <thead><tr><th>Channel</th><th class="num">Value</th><th class="num">Min</th><th class="num">Max</th><th class="num">Std</th><th class="num">Count</th></tr></thead>
      <tbody id="meterBody"></tbody>
    </table>
  </div>
  <div id="scope">
    <div class="scope-header">
      <span id="scopeLabel">select a channel</span>
      <select id="dimSelect" style="display:none"></select>
    </div>
    <div class="scope-chart"><canvas id="scopeCanvas"></canvas></div>
  </div>
</main>
<footer>
  <span id="footChannels">0 channels</span>
  <span id="footRate">0 updates/s</span>
</footer>

<script>
// ── State ──
var selectedChannel = null;
var selectedDim = null;      // null = mean(all), int = specific dim
var channelMeta = {};        // cache: {channel: {shape, dim_labels, dtype}}
var evtSource = null;
var updateCount = 0;
var lastCountReset = Date.now();
var currentEnvId = 0;

var knownNumEnvs = 0;

// ── Init ──
function init() {
  var envInput = document.getElementById('envSelect');
  envInput.onchange = function() { currentEnvId = parseInt(this.value) || 0; reconnect(); };
  connectSSE();
}

function reconnect() {
  // 切换 env_id：重连 SSE + 清缓存
  channelMeta = {};
  connectSSE();
}

// ── SSE ──
function connectSSE() {
  var hz = document.getElementById('hzSelect').value;
  if (evtSource) evtSource.close();
  evtSource = new EventSource('/stream?hz=' + hz + '&env_id=' + currentEnvId);
  evtSource.onopen = function() {
    document.getElementById('statusDot').className = 'dot on';
    document.getElementById('statusText').textContent = 'connected (env ' + currentEnvId + ')';
  };
  evtSource.onerror = function() {
    document.getElementById('statusDot').className = 'dot off';
    document.getElementById('statusText').textContent = 'disconnected';
  };
  evtSource.onmessage = function(e) {
    updateMeter(JSON.parse(e.data));
    updateCount++;
  };
}

// ── Meter ──
function updateMeter(data) {
  // 从 SSE 读取 _meta.num_envs，更新 env input 的 max
  if (data._meta && data._meta.num_envs && data._meta.num_envs !== knownNumEnvs) {
    knownNumEnvs = data._meta.num_envs;
    var envInput = document.getElementById('envSelect');
    envInput.max = String(knownNumEnvs - 1);
    envInput.title = '0 ~ ' + (knownNumEnvs - 1);
  }
  delete data._meta;

  var tbody = document.getElementById('meterBody');
  var channels = Object.keys(data).sort();
  document.getElementById('footChannels').textContent = channels.length + ' channels';

  var now = Date.now();
  if (now - lastCountReset > 2000) {
    var rate = (updateCount / ((now - lastCountReset) / 1000)).toFixed(1);
    document.getElementById('footRate').textContent = rate + ' updates/s';
    updateCount = 0;
    lastCountReset = now;
  }

  var existing = {};
  for (var i = 0; i < tbody.rows.length; i++) existing[tbody.rows[i].dataset.ch] = tbody.rows[i];

  for (var ci = 0; ci < channels.length; ci++) {
    var ch = channels[ci];
    var d = data[ch];
    var row = existing[ch];
    if (!row) {
      row = tbody.insertRow();
      row.dataset.ch = ch;
      row.innerHTML = '<td class="ch-name"></td><td class="num"></td><td class="num"></td><td class="num"></td><td class="num"></td><td class="num"></td>';
      row.onclick = (function(c) { return function() { selectChannel(c); }; })(ch);
    }
    var shapeStr = d.shape && d.shape.length ? ' [' + d.shape.join(',') + ']' : '';
    row.cells[0].textContent = ch + shapeStr;
    row.cells[1].textContent = fmt(d.mean);
    row.cells[2].textContent = fmt(d.min);
    row.cells[3].textContent = fmt(d.max);
    row.cells[4].textContent = fmt(d.std);
    row.cells[5].textContent = d.count || 0;
    row.className = (ch === selectedChannel) ? 'selected' : '';
    delete existing[ch];
  }
  for (var k in existing) existing[k].remove();
}

function fmt(v) { return typeof v === 'number' ? v.toFixed(4) : '\u2014'; }

// ── Channel selection + dim picker ──
function selectChannel(ch) {
  if (selectedChannel === ch) {
    selectedChannel = null;
    selectedDim = null;
    document.getElementById('scope').style.display = 'none';
    return;
  }
  selectedChannel = ch;
  selectedDim = null;
  document.getElementById('scope').style.display = 'flex';
  updateScopeHeader();
  // 获取元数据以构建维度选择器
  if (channelMeta[ch]) {
    buildDimSelect(channelMeta[ch]);
  } else {
    fetch('/meta?channel=' + encodeURIComponent(ch))
      .then(function(r) { return r.json(); })
      .then(function(meta) {
        channelMeta[ch] = meta;
        buildDimSelect(meta);
      })
      .catch(function() { buildDimSelect(null); });
  }
  fetchWaveform();
}

function buildDimSelect(meta) {
  var sel = document.getElementById('dimSelect');
  sel.innerHTML = '';
  // 判断 per-env shape：从 meta.shape 去掉第一维（num_envs）
  var perEnvShape = (meta && meta.shape && meta.shape.length > 1) ? meta.shape.slice(1) : [];
  if (perEnvShape.length === 0 || (perEnvShape.length === 1 && perEnvShape[0] <= 1)) {
    // 标量 channel，不需要 dim 选择
    sel.style.display = 'none';
    selectedDim = null;
    return;
  }
  sel.style.display = '';
  var labels = (meta && meta.dim_labels && meta.dim_labels[0]) ? meta.dim_labels[0] : null;
  var dimSize = perEnvShape[0];
  // "mean(all)" 选项
  var optAll = document.createElement('option');
  optAll.value = ''; optAll.textContent = 'mean(all ' + dimSize + ' dims)';
  sel.appendChild(optAll);
  // 每个维度一个选项
  for (var i = 0; i < dimSize; i++) {
    var opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = labels ? labels[i] : ('dim ' + i);
    sel.appendChild(opt);
  }
  sel.onchange = function() {
    var v = sel.value;
    selectedDim = (v === '') ? null : parseInt(v);
    updateScopeHeader();
    fetchWaveform();
  };
}

function updateScopeHeader() {
  var label = selectedChannel + ' (env ' + currentEnvId;
  if (selectedDim !== null) {
    var meta = channelMeta[selectedChannel];
    var dimName = selectedDim;
    if (meta && meta.dim_labels && meta.dim_labels[0] && meta.dim_labels[0][selectedDim]) {
      dimName = meta.dim_labels[0][selectedDim];
    }
    label += ', ' + dimName;
  }
  label += ')';
  document.getElementById('scopeLabel').textContent = label;
}

// ── Scope: Canvas2D waveform ──
function drawWaveform(canvas, values) {
  var container = canvas.parentElement;
  var dpr = window.devicePixelRatio || 1;
  var cw = container.clientWidth;
  var ch = container.clientHeight;
  canvas.width = cw * dpr;
  canvas.height = ch * dpr;
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';

  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  var W = cw, H = ch;
  var pad = { left: 55, right: 10, top: 10, bottom: 5 };
  var plotW = W - pad.left - pad.right;
  var plotH = H - pad.top - pad.bottom;

  ctx.clearRect(0, 0, W, H);

  if (!values || values.length === 0) {
    ctx.fillStyle = '#888';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('no data', W / 2, H / 2);
    return;
  }

  // Y range
  var yMin = values[0], yMax = values[0];
  for (var i = 1; i < values.length; i++) {
    if (values[i] < yMin) yMin = values[i];
    if (values[i] > yMax) yMax = values[i];
  }
  var yPad = (yMax - yMin) * 0.1;
  if (yPad < 1e-8) yPad = 1;
  yMin -= yPad;
  yMax += yPad;

  // Grid lines (horizontal)
  var gridLines = 5;
  ctx.strokeStyle = '#0f3460';
  ctx.lineWidth = 0.5;
  for (var g = 0; g <= gridLines; g++) {
    var gy = pad.top + (g / gridLines) * plotH;
    ctx.beginPath();
    ctx.moveTo(pad.left, gy);
    ctx.lineTo(pad.left + plotW, gy);
    ctx.stroke();
  }

  // Y axis labels
  ctx.fillStyle = '#888';
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (var g = 0; g <= gridLines; g++) {
    var gy = pad.top + (g / gridLines) * plotH;
    var yVal = yMax - (g / gridLines) * (yMax - yMin);
    ctx.fillText(fmtAxis(yVal), pad.left - 4, gy);
  }

  // Waveform
  ctx.strokeStyle = '#00d4ff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (var i = 0; i < values.length; i++) {
    var x = pad.left + (i / Math.max(values.length - 1, 1)) * plotW;
    var y = pad.top + ((yMax - values[i]) / (yMax - yMin)) * plotH;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function fmtAxis(v) {
  var a = Math.abs(v);
  if (a === 0) return '0';
  if (a >= 1000) return v.toFixed(0);
  if (a >= 1) return v.toFixed(2);
  if (a >= 0.01) return v.toFixed(4);
  return v.toExponential(1);
}

function fetchWaveform() {
  if (!selectedChannel) return;
  var frames = document.getElementById('framesSelect').value;
  var url = '/data?channels=' + encodeURIComponent(selectedChannel)
    + '&frames=' + frames + '&env_id=' + currentEnvId;
  if (selectedDim !== null) url += '&dim=' + selectedDim;
  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var chData = data[selectedChannel];
      if (chData && chData.values && chData.values.length > 0) {
        drawWaveform(document.getElementById('scopeCanvas'), chData.values);
      } else {
        drawWaveform(document.getElementById('scopeCanvas'), []);
      }
    })
    .catch(function() {});
}

// ── Periodic waveform refresh ──
setInterval(function() { if (selectedChannel) fetchWaveform(); }, 500);

// ── Controls ──
document.getElementById('hzSelect').onchange = function() { connectSSE(); };

// ── Start ──
init();
</script>
</body>
</html>
