name: g1_standard_obs
version: "1.0.0"
description: "G1 标准观测管线（行走任务）"

policy:
  base_ang_vel:
    func: mdp.base_ang_vel
    scale: 0.25
    history_length: 1
  projected_gravity:
    func: mdp.projected_gravity
    scale: 1.0
    history_length: 1
  velocity_commands:
    func: mdp.generated_commands
    scale: 1.0
    history_length: 1
  joint_pos:
    func: mdp.joint_pos_rel
    scale: 1.0
    history_length: 1
  joint_vel:
    func: mdp.joint_vel_rel
    scale: 0.05
    history_length: 1
  last_actions:
    func: mdp.last_action
    scale: 1.0
    history_length: 1
