schema: obs_pipeline_v2
name: g1_parkour_amp_v2
version: "2.0.0"
description: "G1 跑酷 + AMP 完整观测管线（depth encoder + history + 4 group）"

blocks:
  # ── 本体感知数据源 ──────────────────────────────────
  - id: base_ang_vel
    type: obs
    kind: mdp
    func: mdp.base_ang_vel
    outputs: [base_ang_vel_scale]

  - id: base_ang_vel_scale
    type: modifier
    kind: scale
    factor: 0.25
    outputs: [base_ang_vel_noise]

  - id: base_ang_vel_noise
    type: modifier
    kind: noise
    noise_type: uniform
    min: -0.2
    max: 0.2
    outputs: [base_ang_vel_history]

  - id: base_ang_vel_history
    type: modifier
    kind: history
    length: 8
    flatten: true
    outputs: [policy_group, critic_group]

  - id: projected_gravity
    type: obs
    kind: mdp
    func: mdp.projected_gravity
    outputs: [projected_gravity_noise]

  - id: projected_gravity_noise
    type: modifier
    kind: noise
    noise_type: uniform
    min: -0.05
    max: 0.05
    outputs: [policy_group, critic_group]

  - id: velocity_commands
    type: obs
    kind: mdp
    func: mdp.generated_commands
    outputs: [policy_group, critic_group]

  - id: joint_pos
    type: obs
    kind: mdp
    func: mdp.joint_pos_rel
    outputs: [joint_pos_noise]

  - id: joint_pos_noise
    type: modifier
    kind: noise
    noise_type: uniform
    min: -0.01
    max: 0.01
    outputs: [joint_pos_history]

  - id: joint_pos_history
    type: modifier
    kind: history
    length: 10
    flatten: true
    outputs: [proprio_encoder, critic_group]

  - id: joint_vel
    type: obs
    kind: mdp
    func: mdp.joint_vel_rel
    outputs: [joint_vel_scale]

  - id: joint_vel_scale
    type: modifier
    kind: scale
    factor: 0.05
    outputs: [joint_vel_history]

  - id: joint_vel_history
    type: modifier
    kind: history
    length: 10
    flatten: true
    outputs: [proprio_encoder, critic_group]

  - id: last_actions
    type: obs
    kind: mdp
    func: mdp.last_action
    outputs: [policy_group, critic_group]

  # ── 深度图像 ────────────────────────────────────────
  - id: depth_image
    type: obs
    kind: sensor
    func: mdp.delayed_visualizable_image
    shape: [1, 18, 32]
    params:
      data_type: distance_to_image_plane
      sensor_cfg: {entity: camera}
      history_skip_frames: 5
      num_output_frames: 8
    outputs: [depth_encoder]

  # ── Privileged（只给 critic）────────────────────────
  - id: base_lin_vel
    type: obs
    kind: mdp
    func: mdp.base_lin_vel
    outputs: [critic_group]

  # ── 编码器 ──────────────────────────────────────────
  - id: depth_encoder
    type: encoder
    kind: conv2d
    output_size: 128
    channels: [4]
    kernel_sizes: [3]
    strides: [1]
    paddings: [1]
    hidden_sizes: [256, 256]
    nonlinearity: ReLU
    use_maxpool: true
    takeout_input: true
    outputs: [policy_group, critic_group]

  - id: proprio_encoder
    type: encoder
    kind: mlp
    output_size: 64
    hidden_sizes: [256, 128]
    outputs: [policy_group]

  # ── AMP 数据源（本体感知子集，无图像） ──────────────
  - id: amp_projected_gravity
    type: obs
    kind: mdp
    func: mdp.projected_gravity
    outputs: [amp_policy_group, amp_reference_group]

  - id: amp_joint_pos
    type: obs
    kind: mdp
    func: mdp.joint_pos_rel
    outputs: [amp_policy_group, amp_reference_group]

  - id: amp_joint_vel
    type: obs
    kind: mdp
    func: mdp.joint_vel_rel
    outputs: [amp_policy_group, amp_reference_group]

  # ── 输出组 ──────────────────────────────────────────
  - id: policy_group
    type: group
    kind: policy
    enable_corruption: true

  - id: critic_group
    type: group
    kind: critic
    enable_corruption: false

  - id: amp_policy_group
    type: group
    kind: amp_policy
    enable_corruption: false

  - id: amp_reference_group
    type: group
    kind: amp_reference
    enable_corruption: false
