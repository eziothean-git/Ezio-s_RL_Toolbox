schema: obs_pipeline_v2
name: g1_flat_loco_v2
version: "2.0.0"
description: "G1 平地行走标准观测（v2 block graph，无 encoder）"

blocks:
  # ── 数据源 ─────────────────────────────────────────
  - id: base_ang_vel
    type: obs
    kind: mdp
    func: mdp.base_ang_vel
    outputs: [base_ang_vel_scale]

  - id: base_ang_vel_scale
    type: modifier
    kind: scale
    factor: 0.25
    outputs: [policy_group, critic_group]

  - id: projected_gravity
    type: obs
    kind: mdp
    func: mdp.projected_gravity
    outputs: [policy_group, critic_group]

  - id: velocity_commands
    type: obs
    kind: mdp
    func: mdp.generated_commands
    outputs: [policy_group, critic_group]

  - id: joint_pos
    type: obs
    kind: mdp
    func: mdp.joint_pos_rel
    outputs: [policy_group, critic_group]

  - id: joint_vel
    type: obs
    kind: mdp
    func: mdp.joint_vel_rel
    outputs: [joint_vel_scale]

  - id: joint_vel_scale
    type: modifier
    kind: scale
    factor: 0.05
    outputs: [policy_group, critic_group]

  - id: last_actions
    type: obs
    kind: mdp
    func: mdp.last_action
    outputs: [policy_group, critic_group]

  # ── Privileged（只给 critic）────────────────────────
  - id: base_lin_vel
    type: obs
    kind: mdp
    func: mdp.base_lin_vel
    outputs: [critic_group]

  # ── 输出组 ─────────────────────────────────────────
  - id: policy_group
    type: group
    kind: policy
    enable_corruption: true

  - id: critic_group
    type: group
    kind: critic
    enable_corruption: false
